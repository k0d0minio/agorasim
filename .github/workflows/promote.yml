# The blueprint owns this file. An update of the blueprint replaces it: do not edit it.
# The promotion to production. Only `.icm/_system/scripts/promote.sh run --tag <v*>` starts
# it, on the operator's word. The contract is .icm/_system/features/uat.md.
# Order: each production build of the tag is READY, then production migrates, then each
# UAT project is promoted. A fault stops the run before production changes.
name: promote
on:
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag (v*) to promote
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: promote
  cancel-in-progress: false
defaults:
  run:
    shell: bash
# The Node version is the one of .nvmrc. A repo with no .nvmrc gets this one.
env:
  NODE_DEFAULT: "22"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TAG: ${{ inputs.tag }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TEAM: ${{ vars.VERCEL_TEAM }}
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: bash .icm/_system/scripts/promote.sh verify --tag "$TAG"


  migrate:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: database-production
      cancel-in-progress: false
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      REQUIRED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ hashFiles('.nvmrc') != '' && '.nvmrc' || '' }}
          node-version: ${{ hashFiles('.nvmrc') == '' && env.NODE_DEFAULT || '' }}
      - run: |
          . .icm/_system/scripts/lib/node.sh
          node_install
          bash .icm/_system/scripts/db.sh migrate


  promote:
    needs: [verify, migrate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAG: ${{ inputs.tag }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TEAM: ${{ vars.VERCEL_TEAM }}
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: bash .icm/_system/scripts/promote.sh ship --tag "$TAG"

