name: Neon cleanup

# The reference branch-cleanup workflow (decision D32) — seeded ONCE by /setup into a repo whose
# `.icm/project.json` reads `database.provider: "neon"` with `database.neon.previews: "vercel"`,
# never by the estate walk. The Vercel integration creates a Neon branch `preview/<git-branch>` for
# every preview deployment and — on the Vercel-managed kind — deletes it only when the deployment
# itself expires, which Vercel's retention policy can put months away
# (https://neon.com/docs/guides/vercel-branch-cleanup). This job deletes that branch the moment the
# PR closes, and the run's own `run/<slug>` branch beside it where db-branch.sh made one and the
# session never ran `down`. It names nothing else: not production, and not the UAT database — a
# project's default branch, which the job never selects.
#
# Which run: `<slug>` is the run FOLDER's name, not the git branch's — a harness-named branch
# (`claude/sleepy-turing-k3vdjt`: a cloud session, OpenCode, Actions) carries a run with any slug.
# So the job reads every `.icm/runs/*/run.md` and `<runs_archive>/*/run.md` on the PR and takes
# each folder whose `- branch:` line equals the PR's head ref (the read resolve-run.sh does). Only
# when no run.md names the branch does it guess `run/<head ref without claude/>`, as before.
#
# Which project (D41): where the repo declares UAT (`uat.target` and `uat.url`), previews and runs
# live in the NON-PRODUCTION project — `database.neon.nonprod_project_id`, the second Marketplace
# database — and this job looks there and nowhere else; production's project is never written. A
# UAT repo without that id, or with production's id in it, fails the job rather than guess. Without
# UAT the one project (`database.neon.project_id`) serves, as before.
#
# The project ids and the key's NAME come from `.icm/project.json` (one home per fact — the same
# `database.neon` block every pipeline script reads); the key's VALUE is this repository's Actions
# secret under that name (`printf '%s' "$KEY" | .icm/scripts/env.sh add NEON_API_KEY --ci --github
# secret`). A missing secret fails the job — the red job is the alert, as everywhere. A branch that
# does not exist is not a failure: a docs-only PR built no preview and made no branch.
#
# Same idiom as lib/neon.sh: curl reads its configuration from stdin so the key never appears in
# argv, and every DELETE names a branch this job found under a pipeline shape (preview/*, run/*).

on:
  pull_request:
    types: [closed]

concurrency:
  group: neon-cleanup-${{ github.event.pull_request.number }}
  cancel-in-progress: false

# `contents: read` and no more: the job's only GitHub act is checking out `.icm/project.json`. With
# `permissions: {}` that checkout fails on a PRIVATE repo ("Repository not found"), so every PR
# close failed and the preview branches piled up to Neon's branch cap (agorasim, 2026-09-23).
permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    name: Delete the PR's Neon branches
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # run.md at any depth: `runs_archive` may name any folder, and project.json is not read yet.
          sparse-checkout: |
            .icm/project.json
            **/run.md
          sparse-checkout-cone-mode: false

      - name: Read the database block
        id: cfg
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          f=.icm/project.json
          {
            echo "provider=$(jq -r '.database.provider // ""' "$f")"
            echo "previews=$(jq -r '.database.neon.previews // ""' "$f")"
            # D41: with UAT, previews and runs live in the non-production project — never production's.
            prod="$(jq -r '.database.neon.project_id // ""' "$f")"
            if jq -e '.database.provider == "neon" and (.uat.target // "") != "" and (.uat.url // "") != ""' "$f" >/dev/null; then
              np="$(jq -r '.database.neon.nonprod_project_id // ""' "$f")"
              [ -n "$np" ] || { echo "::error::uat is declared but database.neon.nonprod_project_id is empty — previews live in the non-production project (D41)" >&2; exit 1; }
              [ "$np" != "$prod" ] || { echo "::error::database.neon.nonprod_project_id is production's project — refusing (D41)" >&2; exit 1; }
              echo "project_id=$np"
            else
              echo "project_id=$prod"
            fi
            echo "key_name=$(jq -r '.database.neon.api_key_env // "NEON_API_KEY"' "$f")"
            echo "preview_branch=preview/${HEAD_REF}"
            # The run's slug from the run.md recording this branch (live and archived runs); else
            # the old guess. Space-separated: a slug is a folder name, never a space.
            archive="$(jq -r '.runs_archive // ".icm/runs/_done"' "$f")"
            archive="${archive%/}"
            slugs=""
            for md in .icm/runs/*/run.md "$archive"/*/run.md; do
              [ -f "$md" ] || continue
              b="$(grep -m1 '^- branch:' "$md" | sed -E 's/^- branch:[[:space:]]*//; s/[[:space:]]+#.*$//; s/[[:space:]]*$//')" || true
              [ "$b" = "$HEAD_REF" ] || continue
              s="$(basename "$(dirname "$md")")"
              case " $slugs " in *" run/$s "*) ;; *) slugs="${slugs:+$slugs }run/$s" ;; esac
            done
            if [ -n "$slugs" ]; then
              echo "::notice::run.md names $HEAD_REF for: $slugs" >&2
            else
              slugs="run/${HEAD_REF#claude/}"
              echo "::notice::no run.md names $HEAD_REF — guessing $slugs" >&2
            fi
            echo "run_branches=$slugs"
          } >> "$GITHUB_OUTPUT"

      - name: Delete preview/<branch> and each run/<slug> when they exist
        if: steps.cfg.outputs.provider == 'neon'
        env:
          NEON_API_KEY: ${{ secrets[steps.cfg.outputs.key_name] }}
          KEY_NAME: ${{ steps.cfg.outputs.key_name }}
          PROJECT_ID: ${{ steps.cfg.outputs.project_id }}
          PREVIEWS: ${{ steps.cfg.outputs.previews }}
          PREVIEW_BRANCH: ${{ steps.cfg.outputs.preview_branch }}
          RUN_BRANCHES: ${{ steps.cfg.outputs.run_branches }}
        run: |
          set -euo pipefail
          [ -n "$PROJECT_ID" ] || { echo "::error::database.neon.project_id is empty in .icm/project.json"; exit 1; }
          [ -n "$NEON_API_KEY" ] || { echo "::error::the secret $KEY_NAME is not set in this repository — printf '%s' \"\$KEY\" | .icm/scripts/env.sh add $KEY_NAME --ci --github secret"; exit 1; }
          api() { # <METHOD> <path>
            printf 'url = "https://console.neon.tech/api/v2%s"\nrequest = "%s"\nheader = "Authorization: Bearer %s"\nheader = "Accept: application/json"\nwrite-out = "\\n%%{http_code}"\nmax-time = 60\nsilent\nshow-error\n' \
              "$2" "$1" "$NEON_API_KEY" | curl --config -
          }
          resp="$(api GET "/projects/$PROJECT_ID/branches")"
          code="$(printf '%s' "$resp" | tail -n1)"
          [ "$code" = "200" ] || { echo "::error::GET /projects/$PROJECT_ID/branches answered HTTP $code"; exit 1; }
          branches="$(printf '%s' "$resp" | sed '$d')"
          read -ra wanted <<< "$RUN_BRANCHES"
          [ "$PREVIEWS" = "vercel" ] && wanted+=("$PREVIEW_BRANCH")
          deleted=0
          for name in "${wanted[@]}"; do
            case "$name" in preview/*|run/*) ;; *) echo "::error::refusing to delete '$name' — not a pipeline branch shape"; exit 1 ;; esac
            id="$(printf '%s' "$branches" | jq -r --arg n "$name" '[.branches[] | select(.name == $n and (.default | not))] | first | .id // empty')"
            if [ -z "$id" ]; then echo "$name: not in the project — nothing to delete"; continue; fi
            resp="$(api DELETE "/projects/$PROJECT_ID/branches/$id")"
            code="$(printf '%s' "$resp" | tail -n1)"
            case "$code" in 2??) echo "deleted $name ($id)"; deleted=$((deleted + 1)) ;; *) echo "::error::DELETE $name ($id) answered HTTP $code"; exit 1 ;; esac
          done
          echo "Neon cleanup: $deleted branch(es) deleted for this PR" >> "$GITHUB_STEP_SUMMARY"
