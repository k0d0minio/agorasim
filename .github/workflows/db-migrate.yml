name: DB migrate

# Provisions the Neon Postgres database with the current Drizzle schema and seed
# data. Runs on pushes to main that touch the migrations or schema, and can be
# triggered manually. Requires the `DATABASE_URL` repository secret (the Neon
# connection string).

on:
  push:
    branches: [main]
    paths:
      - "web/drizzle/**"
      - "web/src/db/**"
      - "web/drizzle.config.ts"
      - ".github/workflows/db-migrate.yml"
  workflow_dispatch:

concurrency:
  # Never run two migrations against the same database at once.
  group: db-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    # Job-level, because a step's own `env` is not visible to that step's `if`
    # — and the seed step needs to test whether it was configured at all.
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ADMIN_SEED_EMAIL: ${{ secrets.ADMIN_SEED_EMAIL }}
      ADMIN_SEED_NAME: ${{ secrets.ADMIN_SEED_NAME }}
      ADMIN_SEED_PASSWORD: ${{ secrets.ADMIN_SEED_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Run Drizzle migrations
        run: pnpm db:migrate

      # A database with no accounts in it locks the team out of /admin, so the
      # first owner is seeded here. Idempotent by design: an address that
      # already has an account is left completely alone, password included —
      # so this is safe to run on every migration.
      #
      # Skipped when the secrets are not set, which keeps the workflow green on
      # a repository that provisions its owner by hand instead.
      - name: Seed the first owner account
        if: env.ADMIN_SEED_EMAIL != '' && env.ADMIN_SEED_PASSWORD != ''
        run: pnpm db:seed-owner
