name: Pipeline

# Offloads five deterministic pipeline chores from the agent's context onto CI:
#   1. labels        — project a run's labels (type/persona/complexity + the stage:* it is now at)
#                      from spec.md and which run outputs exist, so no stage has to advance stage:*
#                      by hand. Pushing a stage's output is what moves the board. Release is the one
#                      exception: it projects `stage:release` itself at its step 1, because its
#                      record push comes at the end of the stage and the close-out push that follows
#                      moves the run folder out of .icm/runs/; the step here only ever confirms it.
#   2. spec-check    — a NON-BLOCKING structural backstop on spec.md. Define still runs
#                      validate-spec.sh before its gate (that is the real check); this only flags
#                      drift on later pushes via the job summary and never red-blocks the PR.
#   3. intake-check  — the same idea for the cut: re-verify an intake batch's bookkeeping
#                      (sequence / depends-on / ## Build order) so a later hand-edit to
#                      breakdown.md cannot silently break the order.
#   4. release-check — a completeness nudge on a releasing run: warn when a run's notes.md carries
#                      its `## Release` record but the PR changed no docs page, and the record says
#                      neither "no docs impact" nor "announce: none" (this repo keeps no changelog —
#                      .icm/_shared/project-rules.md → Announcing).
#   5. knowledge-map — when a PR touches .icm/docs/** or the map itself, verify every path
#                      .icm/_shared/knowledge-map.md names still exists under docs_path.
# All but the label projection are advisory: they write to the job summary and always exit 0.
# Runs only for same-repo PRs (a forked PR gets a read-only token that cannot write labels).
#
# RELEASE PUSHES IN TWO HALVES. Release (stages/04_release/CONTEXT.md, step 7) pushes the
# `## Release` record with the docs and changelog first, and the close-out move (.icm/runs/<slug>/
# → .icm/runs/_done/<slug>/) as a separate push afterwards. The first push is the one the label and
# release-check steps are written for: notes.md is still at its live path. The second is a rename,
# and `git diff --name-only` reports a rename by its NEW path only — under .icm/runs/_done/, which
# the labels step deliberately does not treat as a live run, and which release-check reads from
# either side of the move.
#
# ONE JOB, SIX STEPS. Each advisory step runs under `continue-on-error` and its body always exits
# 0; the final step re-raises ONLY the label step's outcome, so a genuine label-projection fault
# still reds the check while the advisory steps stay incapable of reding anything. The job keeps
# the name `Project run labels` — the blocking-class name the check-run inventory knows
# (.icm/_shared/project-rules.md → The factory).
#
# WHICH FILES THIS PR CHANGED — every step asks it, and it has one correct spelling:
#
#     git diff --name-only "origin/$BASE_REF...$HEAD_SHA"
#
# The obvious `git diff "$BASE_SHA" HEAD` is wrong twice over: `pull_request.base.sha` is the base
# tip from when the PR was OPENED, not the current one; and actions/checkout leaves HEAD on
# refs/pull/N/merge — the base branch merged INTO the head — so HEAD already carries every commit
# the base has made since. That diff reports everything main did in the meantime as "changed by
# this PR" and labels a PR from runs it never touched. Anchoring on the live base branch and the
# real head commit is what isolates the PR's own files. The diff is computed once, into a file
# every step reads.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".icm/runs/**"
      - ".icm/intake/**"
      # The knowledge-map step: the pages the map routes (docs_path in .icm/project.json), and the map itself.
      - ".icm/docs/**"
      - ".icm/_shared/knowledge-map.md"

concurrency:
  group: pipeline-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write # the labels REST API writes to the PR as an issue

jobs:
  pipeline:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    name: Project run labels
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need the base branch and the head commit to diff what the PR changed

      - name: Work out which files this PR changed
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # The PR's own files only — see "WHICH FILES THIS PR CHANGED" at the top of this file.
          git diff --name-only "origin/$BASE_REF...$HEAD_SHA" > "$RUNNER_TEMP/changed-files"
          echo "$(wc -l < "$RUNNER_TEMP/changed-files") changed file(s)."

      - name: Project labels for each changed run
        id: labels
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          # Live runs only: the archive under .icm/runs/_done/ is history, never labelled.
          slugs="$(grep -oE '^\.icm/runs/[^/]+/' "$RUNNER_TEMP/changed-files" \
            | cut -d/ -f3 | grep -vx '_done' | sort -u || true)"
          if [ -z "$slugs" ]; then echo "No changed live runs — nothing to label."; exit 0; fi
          for slug in $slugs; do
            run_dir=".icm/runs/$slug"
            [ -d "$run_dir" ] || { echo "::notice::run '$slug' is no longer live on this head — skipping labels"; continue; }
            # Only ever project a run's labels onto its OWN PR. A PR can touch runs that are not
            # its own — a sweep, a migration — and stamping their set onto this PR would
            # misdescribe it. A run.md with no `- pr:` line yet is this PR's own run mid-scaffold
            # (new-run.sh commits the run before it opens the PR), so it passes.
            run_pr="$(grep -m1 '^- pr:' "$run_dir/run.md" 2>/dev/null \
              | sed -E 's/^- pr:[[:space:]]*//; s/[[:space:]]+#.*$//; s#^.*/pull/##; s/^#//; s/[^0-9].*$//' || true)"
            if [ -n "$run_pr" ] && [ "$run_pr" != "$PR_NUMBER" ]; then
              echo "::notice::run '$slug' changed but belongs to PR #$run_pr — not this one; skipping labels"
              continue
            fi
            # Lane runs have no spec at all — their type:* label is set once by new-run.sh.
            spec="$run_dir/02_define/output/spec.md"
            if [ ! -f "$spec" ]; then
              echo "::notice::run '$slug' changed but has no spec.md (lane run?) — skipping labels"
              continue
            fi
            echo "::group::labels for $slug"
            # One malformed spec must not red-fail the job — warn and carry on.
            .icm/scripts/project-labels.sh "$slug" --stage auto --pr "$PR_NUMBER" \
              || echo "::warning::could not project labels for '$slug' (check the spec header — see log)"
            echo "::endgroup::"
          done

      - name: Validate changed specs (advisory — never a merge gate)
        continue-on-error: true
        run: |
          set -uo pipefail
          specs="$(grep -E '^\.icm/runs/[^/]+/02_define/output/spec\.md$' "$RUNNER_TEMP/changed-files" \
            | grep -v '^\.icm/runs/_done/' | sort -u || true)"
          if [ -z "$specs" ]; then echo "No spec.md changed — nothing to validate."; exit 0; fi
          for spec in $specs; do
            [ -f "$spec" ] || continue
            echo "::group::validate $spec"
            if .icm/scripts/validate-spec.sh "$spec"; then
              echo "- ✅ \`$spec\` — structurally sound" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- ⚠️ \`$spec\` — structural issues (advisory, see log)" >> "$GITHUB_STEP_SUMMARY"
              echo "::warning file=${spec}::Spec has structural issues — advisory, not a merge gate. Fix with revise <slug>."
            fi
            echo "::endgroup::"
          done
          # Advisory by contract: this step always exits 0 so it never blocks the PR.
          exit 0

      - name: Validate changed intake batches (advisory — never a merge gate)
        continue-on-error: true
        run: |
          set -uo pipefail
          # A batch is a folder, not a file: any touched file under .icm/intake/<scope>/ (stub,
          # breakdown, or a _done/ move) re-validates the whole batch, because the invariants are
          # about the set. triage/ is validated too (lane lines only); the archive is not a batch.
          scopes="$(grep -oE '^\.icm/intake/[^/]+/' "$RUNNER_TEMP/changed-files" \
            | cut -d/ -f3 | grep -vx '_done' | sort -u || true)"
          if [ -z "$scopes" ]; then echo "No intake batch changed — nothing to validate."; exit 0; fi
          for scope in $scopes; do
            dir=".icm/intake/$scope"
            # A batch can be archived once every stub has shipped — a moved folder is not a problem.
            [ -d "$dir" ] || { echo "::notice::intake batch '$scope' no longer exists on this head — skipping"; continue; }
            echo "::group::validate $dir"
            if .icm/scripts/validate-intake.sh "$dir"; then
              echo "- ✅ \`$dir\` — batch bookkeeping holds" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- ⚠️ \`$dir\` — sequence / depends-on / build-order problems (advisory, see log)" >> "$GITHUB_STEP_SUMMARY"
              echo "::warning file=${dir}/breakdown.md::Intake batch has structural problems — advisory, not a merge gate. Re-cut from the Scope stage, or fix the stubs by hand."
            fi
            echo "::endgroup::"
          done
          exit 0

      - name: Nudge on a releasing run with no changelog and no docs (advisory)
        continue-on-error: true
        run: |
          set -uo pipefail
          # A run is "releasing" when its notes.md gained the `## Release` record (Release stage,
          # stages/04_release/CONTEXT.md step 7). notes.md is read from either side of the
          # close-out rename: at .icm/runs/<slug>/ on the record push, at .icm/runs/_done/<slug>/
          # on the close-out push that follows.
          changed="$(cat "$RUNNER_TEMP/changed-files")"
          records=""
          for f in $(printf '%s\n' "$changed" \
            | grep -E '^\.icm/runs/(_done/)?[^/]+/03_build/output/notes\.md$' | sort -u || true); do
            [ -f "$f" ] && grep -q '^## Release' "$f" && records="$records $f"
          done
          records="$(printf '%s' "$records" | xargs -n1 2>/dev/null | sort -u || true)"
          if [ -z "$records" ]; then echo "No run releasing in this PR — nothing to check."; exit 0; fi

          # Release's contract (stages/04_release/CONTEXT.md, steps 5–6): update the affected docs
          # page(s) — **or record no impact / announce: none**. This repo keeps no changelog
          # (.icm/_shared/project-rules.md → Announcing), so only the docs half is checked: a page
          # under .icm/docs/ (docs_path), or one of the three out-of-tree pages the knowledge map
          # names in prose. The presence check is deterministic; the escape is prose, so the record
          # is read for it rather than crying wolf on a legitimately silent run.
          has_changelog=0; has_docs=0
          printf '%s\n' "$changed" | grep -qE '^(\.icm/docs/|web/docs/|workspaces/_config/business-facts\.md$)' && has_docs=1

          for record in $records; do
            slug="$(printf '%s' "$record" | sed -E 's#^\.icm/runs/(_done/)?([^/]+)/.*#\2#')"
            if [ "$has_changelog" -eq 1 ] || [ "$has_docs" -eq 1 ]; then
              echo "- ✅ \`$slug\` — releasing with $([ "$has_docs" -eq 1 ] && printf 'docs ')$([ "$has_changelog" -eq 1 ] && printf 'changelog')" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            if grep -Eiq 'announce: *(none|internal)|no (technical|business|end-user|docs|release)[^.]*(impact|note)' "$record"; then
              echo "- ✅ \`$slug\` — no changelog or docs change, and the release record says why" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- ⚠️ \`$slug\` — releasing with no docs page changed (\`.icm/docs/**\`, \`web/docs/**\`, business-facts), and the record says neither no-impact nor announce: none" >> "$GITHUB_STEP_SUMMARY"
              echo "::warning file=${record}::Release completeness: no docs update in this PR. Add it, or record the no-impact in the ## Release section. Advisory, not a merge gate."
            fi
          done
          exit 0

      - name: Check the knowledge map for dead paths (advisory — never a merge gate)
        continue-on-error: true
        run: |
          set -uo pipefail
          # The map (.icm/_shared/knowledge-map.md) is the router every stage loads to find its
          # slice of .icm/docs. A page moved or deleted leaves it pointing at nothing, and the stage
          # that follows the dead path works from memory. Run the check when this PR touches the
          # routed tree or the map itself.
          if ! grep -qE '^(\.icm/docs/|\.icm/_shared/knowledge-map\.md$)' \
               "$RUNNER_TEMP/changed-files"; then
            echo "No .icm/docs page and no knowledge map changed — nothing to check."
            exit 0
          fi
          echo "::group::validate .icm/_shared/knowledge-map.md"
          out="$(.icm/scripts/validate-knowledge-map.sh 2>&1)"; rc=$?
          printf '%s\n' "$out"
          echo "::endgroup::"
          if [ "$rc" -eq 0 ]; then
            echo "- ✅ \`.icm/_shared/knowledge-map.md\` — every path it names resolves" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- ⚠️ \`.icm/_shared/knowledge-map.md\` — names paths that do not resolve (advisory, see log)" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning file=.icm/_shared/knowledge-map.md::Knowledge map has dead paths — a docs page it routes was moved or deleted. Fix the map with \`knowledge edit\` (a separate docs-only PR) or in this PR if it moved the page. Advisory, not a merge gate."
          fi
          exit 0

      - name: Re-raise the label step's outcome
        # The advisory steps are incapable of reding this check; a genuine label-projection fault
        # still must. `outcome` is the step's own result, before continue-on-error masked it.
        if: steps.labels.outcome == 'failure'
        run: |
          echo "::error::Label projection failed — see the 'Project labels for each changed run' step."
          exit 1
