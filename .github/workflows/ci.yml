# The blueprint owns this file. An update of the blueprint replaces it: do not edit it.
# The steps of the job code are in .icm/_system/ci/code.sh. The contract of the database is
# .icm/_system/features/database.md.
# CI is the source of truth: these checks do not run on a computer of a person.
name: ci
on:
  push:
    branches: [main]
  pull_request:
    # A draft runs no job: the checks start when the pull request is ready.
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
defaults:
  run:
    shell: bash
# The Node version is the one of .nvmrc. A repo with no .nvmrc gets this one.
env:
  NODE_DEFAULT: "22"

jobs:
  secrets:
    # gitleaks reads the full history. It is the binary, not the action: the action needs a
    # licence for an organisation.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${f}"
          echo "${GITLEAKS_SHA256}  ${f}" | sha256sum -c -
          tar -xzf "${f}" gitleaks
      - name: Scan the full history
        run: ./gitleaks git --redact --no-banner -v .

  workflows:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint
        run: |
          f="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${f}"
          echo "${ACTIONLINT_SHA256}  ${f}" | sha256sum -c -
          tar -xzf "${f}" actionlint
      - name: actionlint
        run: ./actionlint -color

  code:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    concurrency:
      group: code-${{ github.ref }}
      cancel-in-progress: true

    # A new, empty database for each run. Each migration applies from zero on it.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BASE_REF: ${{ github.base_ref }}

      DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: hashFiles('package.json') != ''
        with:
          node-version-file: ${{ hashFiles('.nvmrc') != '' && '.nvmrc' || '' }}
          node-version: ${{ hashFiles('.nvmrc') == '' && env.NODE_DEFAULT || '' }}
      - run: bash .icm/_system/ci/code.sh


  database:
    # After the proof from zero, migrate the shared database of the event: the preview
    # database for a pull request, and for a push to main the UAT database.
    # One run at a time for each database. A run is never canceled in the middle.
    needs: code
    runs-on: ubuntu-latest
    concurrency:
      group: database-${{ github.event_name == 'push' && 'main' || 'preview' }}
      cancel-in-progress: false
    env:
      REQUIRED: ${{ github.event_name == 'push' }}

      DATABASE_URL: ${{ github.event_name == 'push' && secrets.UAT_DATABASE_URL || secrets.PREVIEW_DATABASE_URL }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ hashFiles('.nvmrc') != '' && '.nvmrc' || '' }}
          node-version: ${{ hashFiles('.nvmrc') == '' && env.NODE_DEFAULT || '' }}
      - run: |
          . .icm/_system/scripts/lib/node.sh
          node_install
          bash .icm/_system/scripts/db.sh migrate


  release:
    # release-please keeps one release pull request open: the batch since the last release.
    # Its merge makes the tag v* and the changelog. It moves nothing to production.
    if: github.event_name == 'push'
    needs: code
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          release-type: node
